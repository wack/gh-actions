name: '⚡Setup Rust'
author: "Robbie McKinstry<robbie@wack.run>"
description: "Install Rust and Related Tools"
inputs:
  shared-key:
    description: "Cache key suffix shared across jobs that should reuse each other's Rust build artifacts. Leave empty for per-job cache (default Swatinem behavior)."
    required: false
    default: ""
  extra-tools:
    description: "Comma-separated list of additional tools to install via taiki-e/install-action (e.g. cargo-nextest, cargo-llvm-cov). cargo-make is always installed."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    # Defer to the repo's pinned toolchain when one is present. If a repo
    # pins a version via rust-toolchain.toml (or the legacy `rust-toolchain`
    # file), we must install the components onto THAT channel — otherwise we
    # install them onto `stable`, which is a different rustup toolchain than
    # the pinned one that cargo actually uses. When that happened, tools like
    # cargo-llvm-cov found `llvm-tools-preview` missing on the pinned
    # toolchain and ran a slow, network-flaky `rustup component add` at build
    # time (which timed out and broke CI). Falls back to `stable` when the
    # repo pins nothing.
    - name: "Resolve Rust toolchain"
      id: toolchain
      shell: bash
      run: |
        channel="stable"
        if [[ -f rust-toolchain.toml ]]; then
          parsed="$(grep -oE 'channel[[:space:]]*=[[:space:]]*"[^"]+"' rust-toolchain.toml | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')"
          [[ -n "$parsed" ]] && channel="$parsed"
        elif [[ -f rust-toolchain ]]; then
          parsed="$(tr -d '[:space:]' < rust-toolchain)"
          [[ -n "$parsed" ]] && channel="$parsed"
        fi
        echo "Resolved Rust toolchain channel: $channel"
        echo "channel=$channel" >> "$GITHUB_OUTPUT"

    - name: "Install Rust"
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        components: "rustfmt,clippy,llvm-tools-preview"

    # Restore the cache. A shared-key lets sibling jobs reuse artifacts;
    # without one, each job gets its own cache namespace.
    - name: "Restore Rust Cache"
      uses: "Swatinem/rust-cache@v2"
      with:
        shared-key: ${{ inputs.shared-key }}

    # Installing from binaries tends to be faster than installing
    # with Cargo from source. cargo-make is always installed because
    # nearly every Wack Rust repo uses it; nextest and other tools are
    # opt-in via `extra-tools` so jobs that don't need them save install time.
    - name: "Install Cargo Tools from Binaries."
      uses: "taiki-e/install-action@v2"
      with:
        tool: ${{ inputs.extra-tools != '' && format('cargo-make,{0}', inputs.extra-tools) || 'cargo-make' }}
